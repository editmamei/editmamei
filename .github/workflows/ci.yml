# Continuous integration for Editmamei CE.
#
# Runs on every push and pull request. This is the check that pull requests are
# gated on, so it deliberately runs exactly what CONTRIBUTING asks contributors
# to run locally: format, lint, typecheck, and the full test suite. A separate,
# NON-required `audit` job surfaces dependency advisories on every PR without
# letting a newly published advisory in a transitive dep (or a registry outage)
# block unrelated merges — the release workflow keeps the blocking audit gate.
#
# Why Windows is the primary runner: Editmamei drives Adobe Photoshop, which
# ships on Windows and macOS only. Parts of the CLI resolve platform-specific
# application-support paths that have no Linux equivalent, so a Linux job would
# fail on environment rather than on code. The suite itself never launches
# Photoshop — it verifies the ExtendScript we generate — so it runs fine on a
# clean runner.

name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
  # Kept so the suite can be re-run against a ref on demand — useful for
  # confirming a runner-side failure rather than a code one. It is a
  # convenience, not a load-bearing path: every job below runs on push and
  # pull_request without it.
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR; the full suite is ~30s and
# there is no value in finishing a run whose commit is already replaced.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Go must be present before `npm ci`: the package's `prepare` script runs
      # the build, which compiles the editmamei-core Go binary. The build warns
      # rather than fails without Go, so installing it here is what makes the
      # binary actually get built and exercised.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go-core/go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: format
        run: npm run format:check

      - name: lint
        run: npm run lint

      - name: typecheck
        run: npm run typecheck

      - name: test
        run: npm test

      - name: go build + test
        working-directory: go-core
        run: |
          go build ./...
          go test ./...

  # Deliberately NOT in the required status checks: advisories should be
  # visible on the PR, not able to freeze unrelated merges. release.yml runs
  # the same audit as a hard gate before anything publishes.
  audit:
    name: audit (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - run: npm ci --ignore-scripts

      - name: audit
        run: npm run audit:ci

  macos:
    # GATING, as of 2026-08-07. macOS is a supported platform and this is its only
    # continuous coverage.
    #
    # It was advisory for one reason: cost. While this repository was private,
    # macOS billed at roughly six times the Windows rate — one day it was about
    # 73% of the Actions spend — so it ran without blocking anything. Public
    # minutes are free, so the reason is gone.
    #
    # "Informational" was worse than it sounds. `continue-on-error` reports a
    # FAILED job as a SUCCESSFUL check, so this ran red while pull requests showed
    # green — for weeks, on a real bug: a leftover directory could turn a
    # successful module regeneration into a failed load, degrading an entitled
    # subscriber to Community, and it only reproduces on POSIX.
    #
    # Green on six consecutive runs since that fix, which is what earns the
    # promotion. If it starts flaking rather than finding real faults, fix the
    # flake — do not quietly demote it back.
    #
    # Removing `continue-on-error` is only half of gating. The other half lives
    # in the `dev` ruleset's required status checks, which must list
    # "test (macos)" — this file cannot enforce that, so if the name here ever
    # changes, update the ruleset in the same breath or gating silently lapses.
    name: test (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: go-core/go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: test
        run: npm test

      - name: go build + test
        working-directory: go-core
        run: |
          go build ./...
          go test ./...

# Continuous integration for Editmamei CE.
#
# Runs on every push and pull request. This is the check that pull requests are
# gated on, so it deliberately runs exactly what CONTRIBUTING asks contributors
# to run locally: format, lint, typecheck, and the full test suite.
#
# Why Windows is the primary runner: Editmamei drives Adobe Photoshop, which
# ships on Windows and macOS only. Parts of the CLI resolve platform-specific
# application-support paths that have no Linux equivalent, so a Linux job would
# fail on environment rather than on code. The suite itself never launches
# Photoshop — it verifies the ExtendScript we generate — so it runs fine on a
# clean runner.

name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
  # Lets the macOS job below be run deliberately. Without this trigger its
  # condition can never be true, which is how an earlier attempt at limiting it
  # ended up with no opt-in path at all.
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR; the full suite is ~30s and
# there is no value in finishing a run whose commit is already replaced.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Go must be present before `npm ci`: the package's `prepare` script runs
      # the build, which compiles the editmamei-core Go binary. The build warns
      # rather than fails without Go, so installing it here is what makes the
      # binary actually get built and exercised.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-core/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: format
        run: npm run format:check

      - name: lint
        run: npm run lint

      - name: typecheck
        run: npm run typecheck

      - name: test
        run: npm test

      - name: go build + test
        working-directory: go-core
        run: |
          go build ./...
          go test ./...

  macos:
    # GATING, as of 2026-08-07. macOS is a supported platform and this is its only
    # continuous coverage.
    #
    # It was advisory for one reason: cost. While this repository was private,
    # macOS billed at roughly six times the Windows rate — one day it was about
    # 73% of the Actions spend — so it ran without blocking anything. Public
    # minutes are free, so the reason is gone.
    #
    # "Informational" was not harmless in the meantime. The job sat red for weeks
    # and nobody looked, because nothing depended on it: it was failing on a real
    # bug where a leftover directory could turn a successful module regeneration
    # into a failed load, which only reproduces on POSIX. A check nobody has to
    # care about is a check nobody reads.
    #
    # Green on six consecutive runs since that fix, which is what earns the
    # promotion. If it starts flaking rather than finding real faults, fix the
    # flake — do not quietly demote it back.
    name: test (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go-core/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: test
        run: npm test

      - name: go build + test
        working-directory: go-core
        run: |
          go build ./...
          go test ./...

# Live coverage for the GIMP backend: builds Editmamei with a real headless GIMP install present
# and runs `tests/gimp-live` against it (per-op pixel verifiers, GEGL schema goldens, geometry/mask
# survival, export options, and the `.xcf` round trip). This is deliberately a SEPARATE workflow
# from `ci.yml` rather than a job in it: it needs an unattended GIMP install and a real live
# GIMP process per test file, which is a different (and slower) shape of job than the rest of the
# suite, and runs only when a pull request touches the GIMP surface (the paths below) -- the
# default `npm test` in ci.yml excludes tests/gimp-live, so this is the only place it runs.
#
# Three jobs: `gimp-windows` (the supported platform, required-check-eligible once green),
# `gimp-macos` (advisory — a GitHub-hosted macOS runner is a FRESH machine every run, with none of
# GIMP's own caches, so it exercises a genuinely cold first launch every time: the exact case
# CALL_READY_WAIT_MS / gimp_starting / the 180s READY_TIMEOUT_MS exist for), and `gimp-linux`
# (advisory, GIMP via Flatpak).

name: GIMP live suite

on:
  pull_request:
    paths:
      - 'src/backends/**'
      - 'src/tools/gimp-*.ts'
      - 'src/modules/gimp/**'
      - 'src/core/server.ts'
      - 'src/utils/tool-helpers.ts'
      - 'src/utils/operation-timeouts.ts'
      - 'src/utils/gimp-path.ts'
      - 'src/core/settings.ts'
      - 'scripts/copy-gimp-bridge.ts'
      - 'scripts/lib/build-common.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.ts'
      - 'tests/gimp-live/**'
      - 'tests/fixtures/fake-gimp-session.ts'
      - '.github/workflows/gimp.yml'
  workflow_dispatch:
  # The installer is pinned (URL + checksum below), so this does not catch GIMP itself drifting --
  # it re-runs the suite (including the GEGL schema goldens) against that exact pinned build on a
  # schedule independent of any PR, as a baseline health check for the suite itself.
  schedule:
    - cron: '17 6 * * *'

concurrency:
  group: gimp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GIMP_VERSION: 3.2.6
  GIMP_WINDOWS_INSTALLER_URL: https://download.gimp.org/gimp/v3.2/windows/gimp-3.2.6-setup.exe
  # Verified against download.gimp.org's own published SHA256SUMS for this release (fetched and
  # read directly, not re-typed by hand) -- if GIMP ships a point update, this pin makes the
  # download step fail loudly instead of silently installing something else.
  GIMP_WINDOWS_INSTALLER_SHA256: 9337cccbc01d4098ee7a3dab215b3afbe6ece99c5287c92441d6f12cf541ebca
  # arm64 (Apple Silicon): the only architecture GitHub-hosted `macos-latest` runners are today.
  # Same verification story as the Windows installer above -- fetched directly from
  # download.gimp.org's own SHA256SUMS for v3.2/macos/, not re-typed by hand.
  GIMP_MACOS_DMG_URL: https://download.gimp.org/gimp/v3.2/macos/gimp-3.2.6-arm64.dmg
  GIMP_MACOS_DMG_SHA256: 854573aec2be6a185aa021109c3c0ca94f210379204b704231bdd191b4060294

jobs:
  gimp-windows:
    # The supported platform for the GIMP backend -- see this workflow's `gimp-linux` job for the
    # advisory cross-platform attempt. Runs on every pull request that touches the GIMP surface
    # (`on.pull_request.paths` above). Whether it is a required status check is set in branch
    # protection, not here. Note for that setting: this workflow is path-filtered, so it does not
    # run at all on a PR outside those paths, and a required check that never reports can hold such
    # a PR open.
    name: gimp-live (windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Restore cached GIMP installer
        id: cache-gimp-installer
        uses: actions/cache@v4
        with:
          path: gimp-installer.exe
          # The checksum is part of the key, not just verified after: bumping the pinned version
          # OR the pinned checksum both invalidate the cache and force a fresh download, so a
          # stale cached installer can never silently sit alongside a changed checksum.
          key: gimp-windows-installer-${{ env.GIMP_VERSION }}-${{ env.GIMP_WINDOWS_INSTALLER_SHA256 }}

      - name: Download the GIMP installer
        if: steps.cache-gimp-installer.outputs.cache-hit != 'true'
        run: curl.exe -fL -o gimp-installer.exe "$env:GIMP_WINDOWS_INSTALLER_URL"

      - name: Verify the installer's SHA-256 against the pinned checksum
        run: |
          $hash = (Get-FileHash gimp-installer.exe -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:GIMP_WINDOWS_INSTALLER_SHA256) {
            Write-Error "GIMP installer checksum mismatch: got $hash, expected $env:GIMP_WINDOWS_INSTALLER_SHA256"
            exit 1
          }

      - name: Install GIMP unattended (Inno Setup, current-user, no restart)
        run: |
          $proc = Start-Process -FilePath .\gimp-installer.exe `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER' `
            -Wait -PassThru -NoNewWindow
          if ($proc.ExitCode -ne 0) {
            Write-Error "GIMP installer exited with code $($proc.ExitCode)"
            exit 1
          }

      # Go must be present before `npm ci`: the package's `prepare` script runs the build, which
      # compiles the editmamei-core Go binary (same reasoning as ci.yml's windows job).
      - uses: actions/setup-go@v7
        with:
          go-version-file: go-core/go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: build
        run: npm run build

      - name: gimp-live suite (fails loudly, not silently, if GIMP wasn't actually found)
        env:
          EDITMAMEI_REQUIRE_GIMP: '1'
          # The large-image timing test runs only on the scheduled build.
          EDITMAMEI_GIMP_PERF: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: npm run test:gimp

  gimp-macos:
    # Advisory, NOT a required check yet -- same posture as `gimp-linux` below: promote once green
    # across a run of builds. Its real value isn't platform coverage for its own sake -- it's that
    # a GitHub-hosted `macos-latest` runner is a FRESH VM every run, with none of GIMP's own caches
    # (font cache, plug-in scan, Gatekeeper's own first-run checks) primed. That means this job
    # exercises a genuinely cold GIMP launch on EVERY run, unlike a long-lived dev machine or a
    # cached self-hosted runner where the first launch only ever happens once. The `cold start`
    # step below runs alone, first, specifically to measure that -- see its own comment.
    name: gimp-live (macos, advisory)
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Restore cached GIMP DMG
        id: cache-gimp-dmg
        uses: actions/cache@v4
        with:
          path: gimp.dmg
          # Same reasoning as the Windows job's cache key: the checksum is part of the key, not
          # just verified after, so a pinned-version-or-checksum bump always forces a fresh
          # download rather than risking a stale cached DMG sitting next to a changed checksum.
          key: gimp-macos-dmg-${{ env.GIMP_VERSION }}-${{ env.GIMP_MACOS_DMG_SHA256 }}

      - name: Download the GIMP DMG
        if: steps.cache-gimp-dmg.outputs.cache-hit != 'true'
        run: curl -fL -o gimp.dmg "$GIMP_MACOS_DMG_URL"

      - name: Verify the DMG's SHA-256 against the pinned checksum
        run: |
          set -euo pipefail
          actual="$(shasum -a 256 gimp.dmg | awk '{print $1}')"
          if [ "$actual" != "$GIMP_MACOS_DMG_SHA256" ]; then
            echo "::error::GIMP DMG checksum mismatch: got $actual, expected $GIMP_MACOS_DMG_SHA256"
            exit 1
          fi

      - name: Mount the DMG and install GIMP.app to /Applications
        run: |
          set -euo pipefail
          # `yes` auto-accepts a software-license-agreement prompt IF the DMG has one (it's a
          # no-op read against stdin if it doesn't) -- hdiutil would otherwise hang waiting for an
          # interactive answer nothing on a runner can give. pipefail is off for this one line:
          # `yes` always dies of SIGPIPE (status 141) once hdiutil exits, which would fail the step
          # even on a clean mount. Whether the mount worked is checked explicitly right after.
          set +o pipefail
          yes | hdiutil attach -nobrowse -readonly -mountpoint /Volumes/GIMP gimp.dmg
          set -o pipefail
          if [ ! -d /Volumes/GIMP/GIMP.app ]; then
            echo "::error::DMG did not mount with GIMP.app at /Volumes/GIMP"
            exit 1
          fi
          cp -R /Volumes/GIMP/GIMP.app /Applications/
          hdiutil detach /Volumes/GIMP

      - name: Verify the expected GIMP console binary exists after install
        run: |
          set -euo pipefail
          ls -la /Applications/GIMP.app/Contents/MacOS
          # gimp-console-3.2 is the first (most specific) name detect.ts's detectMac() looks for --
          # see src/backends/gimp/detect.ts. A DMG layout change that renamed or dropped it would
          # otherwise fail silently, much later, as a plain "no GIMP install was found".
          if [ ! -x /Applications/GIMP.app/Contents/MacOS/gimp-console-3.2 ]; then
            echo "::error::gimp-console-3.2 not found (or not executable) in /Applications/GIMP.app/Contents/MacOS -- detect.ts would not find this install"
            exit 1
          fi

      # Go must be present before `npm ci`: the package's `prepare` script runs the build, which
      # compiles the editmamei-core Go binary (same reasoning as ci.yml's windows job).
      - uses: actions/setup-go@v7
        with:
          go-version-file: go-core/go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: build
        run: npm run build

      - name: cold start (must run first -- the only genuinely FIRST GIMP launch this runner will ever do)
        env:
          EDITMAMEI_REQUIRE_GIMP: '1'
        run: npx vitest run tests/gimp-live/cold-start.live.test.ts

      - name: gimp-live suite (fails loudly, not silently, if GIMP wasn't actually found)
        env:
          EDITMAMEI_REQUIRE_GIMP: '1'
          # The large-image timing test runs only on the scheduled build.
          EDITMAMEI_GIMP_PERF: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: npm run test:gimp

  gimp-linux:
    # Advisory, NOT a required check -- a genuinely separate, non-required job, never
    # `continue-on-error` inside a required one (a `continue-on-error` job reports a FAILED run
    # as a green check, which hides a real failure behind a passing PR). Promote this job to
    # required once it is green across a run of builds and Linux is an actually-supported
    # platform.
    #
    # Whether a real GIMP install runs headless inside a Flatpak sandbox on a CI runner -- and
    # whether that sandbox can read/write the session directory and load ops.py from the host
    # filesystem -- is the open question this job answers empirically: if it fails, the failure
    # itself is the data point.
    name: gimp-live (linux, advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Flatpak + Flathub remote
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install GIMP from Flathub
        run: flatpak install --user -y flathub org.gimp.GIMP

      - uses: actions/setup-go@v7
        with:
          go-version-file: go-core/go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: build
        run: npm run build

      - name: gimp-live suite
        env:
          EDITMAMEI_REQUIRE_GIMP: '1'
          # The large-image timing test runs only on the scheduled build.
          EDITMAMEI_GIMP_PERF: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: npm run test:gimp

# Weekly dependency check against the committed lockfile.
#
# The shipped artifacts carry exactly the versions the lockfile pins, so an
# upstream fix only reaches users through a release. This run surfaces a new
# advisory, or a registry signature that no longer verifies, in a quiet week
# when no pull request would have run the `audit` job. A red run here is the
# prompt to cut a patch release.

name: Dependency audit

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: audit (scheduled)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - id: install
        run: npm ci --ignore-scripts

      - name: advisories in production dependencies
        run: npm run audit:ci

      - name: registry signatures and provenance
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm audit signatures

# Contributor License Agreement check.
#
# CONTRIBUTING.md tells contributors a bot checks the CLA on their first pull
# request and blocks the merge until it is signed. This is that bot. Until it
# existed, that sentence was a promise the repository could not keep — and worse,
# a pull request merged without a signature breaks the single-owner copyright
# chain the Functional Source License depends on: we cannot promise that every
# release converts to MIT in two years if part of the work is not ours to
# relicense. That is not repairable after the fact without tracking down the
# contributor.
#
# Signatures are stored in this repository (`signatures/version1/cla.json`) on
# the default branch. No third-party service holds them, and the whole check runs
# inside Actions — free here, because this repository is public.
#
# Runs on `pull_request_target`, not `pull_request`, because it needs write
# access to comment and to record the signature; `pull_request` from a fork gets
# a read-only token. This workflow deliberately never checks out or executes the
# pull request's code, which is what makes `pull_request_target` safe here.

name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    # Only act on the signing phrase, or on pull requests. Without this every
    # comment on every issue would spin up a runner.
    if: >
      (github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')
      || github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: 'https://github.com/editmamei/editmamei/blob/main/CLA.md'
          path-to-signatures: 'signatures/version1/cla.json'
          branch: 'main'
          # The signing phrase is quoted verbatim in the `if:` above — change one
          # and the workflow silently stops responding to signatures.
          custom-notsigned-prcomment: >
            Thank you for your pull request. Before it can be merged, please read
            the [Contributor License Agreement](https://github.com/editmamei/editmamei/blob/main/CLA.md)
            and sign it by posting the comment below. You keep the copyright in
            your work — this is a licence, not an assignment. You only do this
            once.
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA. Thank you.'
          # Bots cannot agree to a contract.
          allowlist: dependabot[bot],github-actions[bot]

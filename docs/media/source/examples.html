<!doctype html>
<!--
  Source for docs/media/example-{beach,falls,puppy}.webp and social-preview.jpg.
  Render: screenshot each element by id. Examples at 1200x600, device scale 1, transparent
  page background, saved as WebP. #social at 1280x640, saved as JPEG (GitHub's social preview size).
  The photos and prompts are the real sessions shown on editmamei.com/desktop.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>README examples</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { background: transparent; }
  body { width: 1280px; font-family: 'Bricolage Grotesque', system-ui, sans-serif; }
  .ex { width: 1200px; height: 600px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
  .pane { position: relative; overflow: hidden; border-radius: 18px; background: #0f2922; }
  .pane > img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .chip { position: absolute; left: 16px; top: 16px; padding: 8px 16px; border-radius: 999px; font-size: 24px; font-weight: 680;
    background: rgba(8,19,15,.78); color: #f7f4ec; }
  .chip.on { background: #ceff8c; color: #0f2922; }
  .crops { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 18px; background: #143731; }
  .crops figure { flex: 1 1 0; min-width: 0; text-align: center; }
  .crops img { display: block; width: 100%; border-radius: 9px; box-shadow: 0 10px 22px -10px #000; }
  .crops figcaption { margin-top: 10px; font-size: 21px; font-weight: 640; color: #f7f4ec; white-space: nowrap; }

  #social { position: relative; width: 1280px; height: 640px; overflow: hidden; color: #f7f4ec;
    background:
      radial-gradient(55% 60% at 78% 50%, rgba(206,255,140,.16), transparent 70%),
      radial-gradient(50% 60% at 0% 100%, rgba(31,77,68,.65), transparent 70%), #08130f; }
  #social .copy { position: absolute; left: 68px; top: 66px; width: 520px; }
  #social .brand { display: flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 700; letter-spacing: -.01em; }
  #social .brand img { width: 54px; height: 54px; }
  #social h1 { margin-top: 56px; font-size: 66px; line-height: 1; font-weight: 750; letter-spacing: -.04em; }
  #social h1 i { font-style: normal; color: #ceff8c; }
  #social .sub { margin-top: 24px; font-size: 25px; line-height: 1.32; color: #c3d2cb; }
  #social .url { position: absolute; left: 68px; bottom: 50px; font-size: 23px; font-weight: 600; color: #ceff8c; }
  #social .win { position: absolute; right: -58px; top: 118px; width: 680px; border-radius: 16px; overflow: hidden;
    box-shadow: 0 40px 80px -30px rgba(0,0,0,.9), 0 0 0 1px rgba(255,255,255,.12); }
  #social .win img { display: block; width: 100%; }
</style>
</head>
<body>
  <div class="ex" id="beach">
    <div class="pane"><img src="https://editmamei.com/desktop/beach-before.webp" alt=""><span class="chip">Original</span></div>
    <div class="pane"><img src="https://editmamei.com/desktop/beach-after.webp" alt=""><span class="chip on">Edited</span></div>
  </div>
  <div class="ex" id="falls">
    <div class="pane"><img src="https://editmamei.com/desktop/falls-before.webp" alt="" style="object-position:center 22%"><span class="chip">Original</span></div>
    <div class="pane"><img src="https://editmamei.com/desktop/falls-after.webp" alt="" style="object-position:center 22%"><span class="chip on">Edited</span></div>
  </div>
  <div class="ex" id="puppy">
    <div class="pane"><img src="https://editmamei.com/desktop/puppy-before.webp" alt="" style="object-position:center 60%"><span class="chip">Original</span></div>
    <div class="pane crops">
      <figure><img src="https://editmamei.com/desktop/puppy-post.webp" alt=""><figcaption>Post</figcaption></figure>
      <figure><img src="https://editmamei.com/desktop/puppy-story.webp" alt=""><figcaption>Story</figcaption></figure>
      <figure><img src="https://editmamei.com/desktop/puppy-print.webp" alt=""><figcaption>8×10 print</figcaption></figure>
    </div>
  </div>

  <div id="social">
    <div class="copy">
      <div class="brand"><img src="https://editmamei.com/icons/icon-192.png" alt="">Editmamei</div>
      <h1>Give your AI assistant a real photo editor<i>.</i></h1>
      <p class="sub">Layers and masks you can keep editing, in Photoshop or GIMP, on your computer.</p>
    </div>
    <div class="url">editmamei.com</div>
    <div class="win"><img src="https://editmamei.com/desktop/hero-poster.webp" alt=""></div>
  </div>
</body>
</html>
